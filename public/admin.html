<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESTREVAL / Admin</title><link rel="stylesheet" href="/style.css"><style>.admin{max-width:900px;margin:80px auto;padding:0 25px}.form{background:#fffafb;border:1px solid var(--line);padding:35px}.form label{display:block;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--wine);margin:18px 0 7px}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid var(--line);background:var(--milk);font:14px var(--sans);box-sizing:border-box}.form textarea{min-height:180px}.btn{margin-top:20px;padding:14px 20px;border:0;background:var(--wine);color:white;cursor:pointer}.list{margin-top:30px}.item{border-top:1px solid var(--line);padding:15px 0;display:flex;justify-content:space-between;gap:20px}.item button{border:0;background:none;color:var(--wine);cursor:pointer}.hidden{display:none}.hint{font-size:12px;opacity:.65;line-height:1.5}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{padding:10px 14px;border:1px solid var(--line);background:transparent;cursor:pointer}.tabs button.active{background:var(--wine);color:#fff}</style></head><body><div class="admin"><p class="eyebrow">ESTREVAL / ADMINISTRATION</p><h1 style="font:500 70px var(--serif);color:var(--wine)">Control <i>room.</i></h1>
<div id="login" class="form"><label>Пароль администратора</label><input id="password" type="password" autocomplete="current-password"><button class="btn" id="loginBtn">Войти</button><p id="loginMsg"></p></div>
<div id="panel" class="hidden"><div class="tabs"><button class="active" data-mode="place">Локации</button><button data-mode="eclat">Eclat Éditions</button></div><div class="form"><label>Раздел</label><select id="section"><option value="place">Локация</option><option value="eclat">Публикация журнала</option></select><label>Название</label><input id="title"><label id="categoryLabel">Категория</label><input id="category" placeholder="Например: Мода"><label>Краткое описание</label><textarea id="excerpt"></textarea><label>Основной текст</label><textarea id="text"></textarea><label>Изображение</label><input id="image" placeholder="Ссылка на изображение (необязательно)"><p class="hint">Все поля здесь сохраняются в D1. Никаких демонстрационных записей на сайте нет.</p><button class="btn" id="save">Создать запись</button><button class="btn" id="clear" style="background:var(--rose);margin-left:10px">Очистить</button></div><div class="list" id="list"></div></div></div>
<script>
let pw='',editing=null,currentMode='place';const $=x=>document.querySelector(x);
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-password':pw,'content-type':'application/json'};return fetch(url,opt)}
function reset(){editing=null;['title','category','excerpt','text','image'].forEach(x=>$('#'+x).value='');$('#save').textContent='Создать запись'}
function setMode(mode){currentMode=mode;$('#section').value=mode;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));reset();load()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$('#section').onchange=()=>{currentMode=$('#section').value;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.mode===currentMode));load()};
$('#loginBtn').onclick=async()=>{pw=$('#password').value;const r=await api('/api/admin/check',{method:'POST'});if(r.ok){$('#login').classList.add('hidden');$('#panel').classList.remove('hidden');load()}else $('#loginMsg').textContent='Неверный пароль или пароль не настроен в Cloudflare.'};
async function load(){const r=await fetch('/api/posts?section='+currentMode);const ps=await r.json();$('#list').innerHTML=ps.map(p=>`<div class="item"><span><b>${esc(p.title)}</b><br><small>${esc(p.section)} · ${esc(p.category)}</small></span><span><button onclick='edit(${JSON.stringify(p)})'>Изменить</button><button onclick='del("${p.id}")'>Удалить</button></span></div>`).join('')||'<p>Записей пока нет.</p>'}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function edit(p){editing=p;currentMode=p.section;$('#section').value=p.section;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.mode===p.section));$('#title').value=p.title;$('#category').value=p.category;$('#excerpt').value=p.excerpt||'';$('#image').value=p.image||'';$('#text').value=(p.blocks||[]).map(x=>x.text||'').join('\n\n');$('#save').textContent='Сохранить изменения';window.scrollTo({top:0,behavior:'smooth'})}
async function del(id){if(!confirm('Удалить запись?'))return;const r=await api('/api/posts/'+encodeURIComponent(id),{method:'DELETE'});if(r.ok)load();else alert('Ошибка удаления')}
$('#save').onclick=async()=>{const data={title:$('#title').value,category:$('#category').value,section:$('#section').value,excerpt:$('#excerpt').value,image:$('#image').value,blocks:[{type:'text',text:$('#text').value}]};const r=await api(editing?'/api/posts/'+editing.id:'/api/posts',{method:editing?'PUT':'POST',body:JSON.stringify(data)});if(r.ok){reset();load()}else {const e=await r.json().catch(()=>({}));alert(e.error||'Ошибка сохранения')}};
$('#clear').onclick=reset;
</script></body></html>
