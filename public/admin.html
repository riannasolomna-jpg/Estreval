<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESTREVAL / Admin</title><link rel="stylesheet" href="/style.css"><style>.admin{max-width:900px;margin:80px auto;padding:0 25px}.form{background:#fffafb;border:1px solid var(--line);padding:35px}.form label{display:block;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--wine);margin:18px 0 7px}.form input,.form textarea,.form select{width:100%;padding:12px;border:1px solid var(--line);background:var(--milk);font:14px var(--sans)}.form textarea{min-height:180px}.btn{margin-top:20px;padding:14px 20px;border:0;background:var(--wine);color:white;cursor:pointer}.list{margin-top:30px}.item{border-top:1px solid var(--line);padding:15px 0;display:flex;justify-content:space-between}.item button{border:0;background:none;color:var(--wine);cursor:pointer}.hidden{display:none}</style></head><body><div class="admin"><p class="eyebrow">ESTREVAL / ADMINISTRATION</p><h1 style="font:500 70px var(--serif);color:var(--wine)">Control <i>room.</i></h1><div id="login" class="form"><label>Пароль администратора</label><input id="password" type="password"><button class="btn" id="loginBtn">Войти</button><p id="loginMsg"></p></div><div id="panel" class="hidden"><div class="form"><label>Тип</label><select id="section"><option value="place">Локация</option><option value="eclat">Eclat Éditions</option></select><label>Название</label><input id="title"><label>Категория</label><input id="category" placeholder="Например: Мода"><label>Краткое описание</label><textarea id="excerpt"></textarea><label>Основной текст</label><textarea id="text"></textarea><button class="btn" id="save">Создать публикацию</button><button class="btn" id="clear" style="background:var(--rose);margin-left:10px">Очистить</button></div><div class="list" id="list"></div></div></div><script>
let pw='',editing=null;const $=x=>document.querySelector(x);async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-admin-password':pw,'content-type':'application/json'};return fetch(url,opt)}$('#loginBtn').onclick=async()=>{pw=$('#password').value;const r=await api('/api/admin/check',{method:'POST'});if(r.ok){$('#login').classList.add('hidden');$('#panel').classList.remove('hidden');load()}else $('#loginMsg').textContent='Неверный пароль.'};async function load(){const r=await fetch('/api/posts');const ps=await r.json();$('#list').innerHTML=ps.map(p=>`<div class="item"><span><b>${p.title}</b><br><small>${p.section} · ${p.category}</small></span><span><button onclick='edit(${JSON.stringify(p)})'>Изменить</button><button onclick='del("${p.id}")'>Удалить</button></span></div>`).join('')||'<p>Публикаций пока нет.</p>'}function edit(p){editing=p;$('#section').value=p.section;$('#title').value=p.title;$('#category').value=p.category;$('#excerpt').value=p.excerpt||'';$('#text').value=(p.blocks||[]).map(x=>x.text||'').join('\n\n');$('#save').textContent='Сохранить изменения'}async function del(id){if(!confirm('Удалить публикацию?'))return;await api('/api/posts/'+encodeURIComponent(id),{method:'DELETE'});load()}$('#save').onclick=async()=>{const data={title:$('#title').value,category:$('#category').value,section:$('#section').value,excerpt:$('#excerpt').value,blocks:[{type:'text',text:$('#text').value}]};const r=await api(editing?'/api/posts/'+editing.id:'/api/posts',{method:editing?'PUT':'POST',body:JSON.stringify(data)});if(r.ok){editing=null;$('#save').textContent='Создать публикацию';load()}else alert('Ошибка сохранения')};$('#clear').onclick=()=>{editing=null;['title','category','excerpt','text'].forEach(x=>$('#'+x).value='');$('#save').textContent='Создать публикацию'};
</script></body></html>
