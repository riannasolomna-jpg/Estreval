<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESTREVAL / Admin</title><link rel="stylesheet" href="/style.css"></head><body><main style="max-width:760px;margin:70px auto;padding:24px"><p class="eyebrow">ESTREVAL / ADMINISTRATION</p><h1 style="font:500 68px var(--serif);color:var(--wine)">Control <i>room.</i></h1><section id="login" style="border:1px solid var(--line);padding:30px;background:#fffafb"><label style="display:block;font-size:10px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px">Пароль администратора</label><input id="password" type="password" style="width:100%;box-sizing:border-box;padding:14px;border:1px solid var(--line);background:var(--milk)"><button id="loginBtn" class="btn" style="margin-top:18px">Войти</button><p id="msg"></p></section><section id="panel" hidden style="margin-top:25px;border:1px solid var(--line);padding:30px;background:#fffafb"><h2 style="font:500 32px var(--serif);color:var(--wine)">Доступ получен</h2><p>Авторизация работает. Перейди к редактору сайта через меню.</p><a class="btn" href="/">Открыть архив</a></section></main><script>
const $=s=>document.querySelector(s);let password="";
async function check(){let r=await fetch('/api/admin/status');let d=await r.json();return d.configured}
$('#loginBtn').onclick=async()=>{const configured=await check().catch(()=>null);if(configured===false){$('#msg').textContent='ADMIN_PASSWORD не найден у этого Worker. Secret нужно добавить именно в тот Worker, который обслуживает этот сайт.';return}password=$('#password').value;let r=await fetch('/api/admin/check',{method:'POST',headers:{'x-admin-password':password}});let d=await r.json().catch(()=>({}));if(r.ok){$('#login').hidden=true;$('#panel').hidden=false}else if(d.error==='ADMIN_PASSWORD_NOT_CONFIGURED')$('#msg').textContent='Пароль не настроен у Worker.';else if(d.error==='INVALID_PASSWORD')$('#msg').textContent='Пароль не совпадает с ADMIN_PASSWORD этого Worker.';else $('#msg').textContent='Ошибка авторизации: '+r.status};
</script></body></html>
