<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESTREVAL / Admin</title><link rel="stylesheet" href="/style.css"><style>
.admin{max-width:980px;margin:55px auto;padding:0 24px}.form{background:#fffafb;border:1px solid var(--line);padding:32px}.form label{display:block;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--wine);margin:18px 0 7px}.form input,.form textarea,.form select{width:100%;padding:13px;border:1px solid var(--line);background:var(--milk);font:14px var(--sans);box-sizing:border-box}.form textarea{min-height:120px;resize:vertical}.optional{color:var(--muted);font-size:8px}.tabs{display:flex;gap:8px;margin:22px 0}.tabs button,.add button,.move{padding:10px 14px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:9px;letter-spacing:.1em;text-transform:uppercase}.tabs button.active{background:var(--wine);color:white}.blocks{margin-top:28px}.blocks-head{display:flex;justify-content:space-between;align-items:end}.blocks-head h2{font:500 30px var(--serif);color:var(--wine);margin:0}.block{border:1px solid var(--line);background:#fff;padding:20px;margin:12px 0}.block-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.block-name{font:500 21px var(--serif);color:var(--wine)}.block-actions{display:flex;gap:4px}.move,.remove{border:1px solid var(--line);background:transparent;color:var(--wine);cursor:pointer;padding:4px 8px}.remove{border:0;color:var(--rose);font-size:20px}.hint{font-size:10px;line-height:1.6;color:var(--muted)}.add{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 25px}.list{margin-top:30px}.item{border-top:1px solid var(--line);padding:16px 0;display:flex;justify-content:space-between;gap:15px}.item button{border:0;background:none;color:var(--wine);cursor:pointer;font-size:10px}.hidden{display:none}
</style></head><body><div class="admin"><p class="eyebrow">ESTREVAL / ADMINISTRATION</p><h1 style="font:500 68px var(--serif);color:var(--wine)">Control <i>room.</i></h1><div id="login" class="form"><label>Пароль администратора</label><input id="password" type="password"><button class="btn" id="loginBtn" style="margin-top:18px">Войти</button><p id="loginMsg"></p></div><div id="panel" class="hidden"><div class="tabs"><button data-mode="place" class="active">Локации</button><button data-mode="eclat">Eclat Éditions</button></div><div class="form"><label>Раздел</label><select id="section"><option value="place">Локация</option><option value="eclat">Публикация журнала</option></select><label>Название</label><input id="title" placeholder="Название записи"><label>Категория</label><select id="category"></select><div id="journalCat" class="hidden"><label>Категория журнала</label><input id="journalCategory" placeholder="Например: Новости, Мода, Искусство"></div><label>Краткое описание <span class="optional">необязательно</span></label><textarea id="excerpt" placeholder="Анонс записи — можно оставить пустым."></textarea><div class="blocks"><div class="blocks-head"><h2>Содержание</h2><span class="optional">все блоки необязательны</span></div><p class="hint">Собирай карточку как конструктор. Текст можно разбивать на абзацы: оставляй пустую строку между абзацами.</p><div id="blocks"></div><div class="add"><button onclick="addBlock('text')">＋ Текст</button><button onclick="addBlock('heading')">＋ Заголовок</button><button onclick="addBlock('quote')">＋ Цитата</button><button onclick="addBlock('image')">＋ Изображение</button></div></div><button class="btn" id="save">Создать запись</button><button class="btn" id="clear" style="margin-left:7px">Очистить</button></div><div class="list" id="list"></div></div></div>
<script>
const PLACE_CATEGORIES=['Мода','Искусство и культура','СМИ','Правопорядок','Бары и клубы','Подполье','Отели светские','Город','Прочее'];let pw='',editing=null,currentMode='place',bid=0,$=s=>document.querySelector(s);
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function fillCat(v=''){if(currentMode==='place'){let s=$('#category');s.innerHTML=PLACE_CATEGORIES.map(x=>`<option>${esc(x)}</option>`).join('');s.value=v||'Мода';$('#journalCat').classList.add('hidden')}else{$('#category').innerHTML='';$('#journalCat').classList.remove('hidden');$('#journalCategory').value=v||''}}
async function api(u,o={}){o.headers={...(o.headers||{}),'x-admin-password':pw,'content-type':'application/json'};return fetch(u,o)}
function reset(){editing=null;$('#title').value='';$('#excerpt').value='';$('#blocks').innerHTML='';$('#journalCategory').value='';fillCat();$('#save').textContent='Создать запись'}
function mode(m){currentMode=m;$('#section').value=m;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));reset();load()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>mode(b.dataset.mode));$('#section').onchange=()=>mode($('#section').value);
function addBlock(type,d={}){let el=document.createElement('div');el.className='block';el.dataset.type=type;let inner=`<div class="block-top"><span class="block-name">${type==='text'?'Текст':type==='heading'?'Заголовок':type==='quote'?'Цитата':'Изображение'}</span><span class="block-actions"><button class="move" onclick="mv(this,-1)">↑</button><button class="move" onclick="mv(this,1)">↓</button><button class="remove" onclick="this.closest('.block').remove()">×</button></span></div>`;if(type==='text'||type==='quote')inner+=`<textarea class="txt" placeholder="${type==='quote'?'Текст цитаты...':'Текст блока...'}">${esc(d.text||'')}</textarea>`;if(type==='heading')inner+=`<input class="heading" placeholder="Заголовок..." value="${esc(d.heading||d.text||'')}">`;if(type==='image')inner+=`<input class="img" placeholder="Ссылка на изображение" value="${esc(d.image||'')}"><input class="cap" placeholder="Подпись — необязательно" value="${esc(d.caption||'')}">`;el.innerHTML=inner;$('#blocks').appendChild(el)}
function mv(b,dir){let e=b.closest('.block'),a=[...document.querySelectorAll('.block')],i=a.indexOf(e),t=a[i+dir];if(t)(dir<0?t.before(e):t.after(e))}
function collect(){return [...document.querySelectorAll('#blocks .block')].map(e=>{let t=e.dataset.type;return t==='heading'?{type:t,heading:e.querySelector('.heading').value}:t==='image'?{type:t,image:e.querySelector('.img').value,caption:e.querySelector('.cap').value}:{type:t,text:e.querySelector('.txt').value}})}
$('#loginBtn').onclick=async()=>{pw=$('#password').value;let r=await api('/api/admin/check',{method:'POST'});if(r.ok){$('#login').classList.add('hidden');$('#panel').classList.remove('hidden');fillCat();load()}else $('#loginMsg').textContent='Неверный пароль или пароль не настроен в Cloudflare.'};
async function load(){let r=await fetch('/api/posts?section='+currentMode),ps=await r.json();$('#list').innerHTML=ps.map(p=>`<div class="item"><span><b>${esc(p.title)}</b><br><small>${esc(p.category)}</small></span><span><button onclick='edit(${JSON.stringify(p)})'>Изменить</button><button onclick='del("${p.id}")'>Удалить</button></span></div>`).join('')||'<p class="hint">Записей пока нет.</p>'}
function edit(p){editing=p;currentMode=p.section;$('#section').value=p.section;fillCat(p.category);$('#title').value=p.title;$('#excerpt').value=p.excerpt||'';$('#blocks').innerHTML='';(p.blocks||[]).forEach(b=>addBlock(b.type,b));$('#save').textContent='Сохранить изменения';scrollTo({top:0,behavior:'smooth'})}
async function del(id){if(confirm('Удалить запись?')){let r=await api('/api/posts/'+id,{method:'DELETE'});if(r.ok)load()}}
$('#save').onclick=async()=>{let cat=currentMode==='place'?$('#category').value:$('#journalCategory').value.trim();let d={title:$('#title').value.trim(),category:cat,section:currentMode,excerpt:$('#excerpt').value,image:'',blocks:collect()};if(!d.title||!d.category){alert('Название и категория обязательны.');return}let r=await api(editing?'/api/posts/'+editing.id:'/api/posts',{method:editing?'PUT':'POST',body:JSON.stringify(d)});if(r.ok){reset();load()}else{let x=await r.json().catch(()=>({}));alert(x.error||'Ошибка сохранения')}};
$('#clear').onclick=reset;
</script></body></html>
